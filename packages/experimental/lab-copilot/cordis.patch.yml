# Complete lab composition. No base, shell, filesystem tools, installation or telemetry.
- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: school-model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          school:
            api: openai-responses
            baseURL: http://10.15.171.204:30969/v1
            # This campus endpoint is unauthenticated; pi-ai requires an explicit header.
            headers:
              Authorization: Bearer campus-local-placeholder
            models:
              - id: deepseek-pro
                input: [text, image]
                contextWindow: 1048576
                maxTokens: 65536
                reasoningEfforts:
                  high: high
            reasoning: high
            timeoutMs: 300000
            compat:
              supportsDeveloperRole: false
              supportsMaxOutputTokens: true
    - id: attachments
      name: '@deepseek-ai/dsh-attachment-local'
      config:
        dshHome: !!js process.env.LAB_DSH_STATE ?? dshHomePath()
        maxImagesPerMessage: 8
        maxImageBytes: 20971520
        maxMessageImageBytes: 167772160
    - id: skills
      name: '@deepseek-ai/dsh-skill'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
        maxParallelToolCalls: 1
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js |
          process.env.LAB_DSH_STATE ? process.env.LAB_DSH_STATE + '/sessions' : dshHomePath('sessions')
        compression: none
    - id: session-checkpoint-policy
      name: '@deepseek-ai/dsh-session-checkpoint-policy'
    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js |
          process.env.LAB_DSH_STATE ? process.env.LAB_DSH_STATE + '/speech-to-text/sensevoice' : dshHomePath('speech-to-text', 'sensevoice')
        modelDirectory: !!js process.env.LAB_VOICE_MODEL_DIR
        vadModelPath: !!js process.env.LAB_VOICE_VAD_PATH
        precision: int8
        maxPending: 2
    - id: lab-gateway
      name: '@deepseek-ai/dsh-lab-copilot'
      config:
        port: !!js Number(process.env.LAB_DSH_PORT ?? 8766)
        callbackBase: !!js process.env.LAB_CALLBACK_URL ?? 'http://127.0.0.1:8000'
        provider: school
        model: deepseek-pro
        maxRunMs: 300000
        maxToolCalls: 40
